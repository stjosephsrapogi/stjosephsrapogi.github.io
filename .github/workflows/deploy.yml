# Builds the website as static pages and publishes it to GitHub Pages
# on every push to the main branch (including changes synced from Lovable).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Work out the site folder
        # owner.github.io repos are served at the root; any other repo name is a sub-folder.
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          if [ "$REPO" = "$OWNER.github.io" ]; then BASE="/"; else BASE="/${{ github.event.repository.name }}/"; fi
          echo "BASE_PATH=$BASE" >> "$GITHUB_ENV"
          echo "Site folder: $BASE"

      - name: Build static site
        run: bun run build
        env:
          GITHUB_PAGES: "true"

      - name: Prepare GitHub Pages files
        run: |
          # Unknown addresses get the site shell, which then shows the "Page not found" screen.
          cp .output/public/index.html .output/public/404.html
          touch .output/public/.nojekyll
          ls -la .output/public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
